<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Browser Terminal - Phase 1</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/css/xterm.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm-addon-fit/0.8.0/lib/xterm-addon-fit.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #1e1e1e;
      height: 100%;
    }
    #terminal-container {
      padding: 10px;
      box-sizing: border-box;
      height: 100vh;
    }
    #status {
      color: #9cdcfe;
      font-family: monospace;
      font-size: 12px;
      padding: 4px 10px;
    }
  </style>
</head>
<body>
  <div id="status">Connecting...</div>
  <div id="terminal-container"></div>

  <script>
    const term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      theme: {
        background: '#1e1e1e',
        foreground: '#d4d4d4'
      }
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal-container'));
    fitAddon.fit();

    // CHANGED: instead of a hardcoded URL, build the WebSocket address
    // from whatever host this page is currently being served from.
    // This means the SAME file works on Render, localhost, or any other
    // host — no manual editing needed when you redeploy or move servers.
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(`${wsProtocol}//${window.location.host}`);
    const statusEl = document.getElementById('status');

    socket.addEventListener('open', () => {
      statusEl.textContent = 'Connected to backend shell.';
      socket.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    });

    socket.addEventListener('close', () => {
      statusEl.textContent = 'Disconnected from backend.';
      term.write('\r\n\x1b[31m[Connection closed]\x1b[0m\r\n');
    });

    socket.addEventListener('error', (err) => {
      statusEl.textContent = 'Connection error. Is the backend server running?';
      console.error('WebSocket error:', err);
    });

    socket.addEventListener('message', (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'output') {
        term.write(msg.data);
      } else if (msg.type === 'exit') {
        term.write(`\r\n\x1b[33m[Shell exited with code ${msg.exitCode}]\x1b[0m\r\n`);
      }
    });

    term.onData((data) => {
      if (socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: 'input', data }));
      }
    });

    window.addEventListener('resize', () => {
      fitAddon.fit();
      if (socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
      }
    });
  </script>
</body>
</html>
